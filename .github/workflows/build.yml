name: Build WDK Driver

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install WDK via Visual Studio Installer
        run: |
          # Use Visual Studio Installer to add WDK workload
          $vsInstaller = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"
          
          if (Test-Path $vsInstaller) {
            Write-Host "Installing WDK workload via VS Installer..."
            Start-Process -FilePath $vsInstaller -ArgumentList `
              "modify", `
              "--installPath", "${env:ProgramFiles(x86)}\Microsoft Visual Studio\2022\Enterprise", `
              "--add", "Microsoft.VisualStudio.Component.Windows11SDK.22621", `
              "--add", "Microsoft.DriverKit.BuildTools", `
              "--quiet", "--norestart", "--wait" `
              -Wait -NoNewWindow
            Write-Host "WDK installation completed"
          } else {
            Write-Host "VS Installer not found, trying alternative method..."
          }

      - name: Install WDK (Fallback)
        if: failure()
        run: |
          # Download WDK with retry
          $maxRetries = 3
          $retryCount = 0
          $success = $false
          
          while (-not $success -and $retryCount -lt $maxRetries) {
            try {
              $retryCount++
              Write-Host "Download attempt $retryCount of $maxRetries..."
              
              $wdkUrl = "https://go.microsoft.com/fwlink/?linkid=2284667"
              $wdkInstaller = "$env:TEMP\wdksetup.exe"
              
              # Download with WebClient (more reliable)
              $webClient = New-Object System.Net.WebClient
              $webClient.DownloadFile($wdkUrl, $wdkInstaller)
              
              # Verify file exists and has content
              if ((Test-Path $wdkInstaller) -and (Get-Item $wdkInstaller).Length -gt 1MB) {
                Write-Host "Download successful, installing..."
                Start-Process -FilePath $wdkInstaller -ArgumentList "/quiet", "/norestart" -Wait
                $success = $true
                Write-Host "WDK installed successfully"
              } else {
                throw "Downloaded file is too small or missing"
              }
            } catch {
              Write-Host "Attempt $retryCount failed: $_"
              if ($retryCount -lt $maxRetries) {
                Start-Sleep -Seconds 5
              }
            }
          }
          
          if (-not $success) {
            Write-Host "WARNING: WDK installation failed, continuing with build..."
          }

      - name: Find MSBuild
        id: msbuild
        run: |
          # Try multiple locations for MSBuild
          $possiblePaths = @(
            "${env:ProgramFiles(x86)}\Microsoft Visual Studio\2022\Enterprise\MSBuild\Current\Bin\MSBuild.exe",
            "${env:ProgramFiles}\Microsoft Visual Studio\2022\Enterprise\MSBuild\Current\Bin\MSBuild.exe",
            "${env:ProgramFiles(x86)}\Microsoft Visual Studio\2022\BuildTools\MSBuild\Current\Bin\MSBuild.exe",
            "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\MSBuild\Current\Bin\MSBuild.exe",
            "C:\Program Files (x86)\Microsoft Visual Studio\2022\Enterprise\MSBuild\Current\Bin\MSBuild.exe"
          )
          
          $msbuildPath = $null
          foreach ($path in $possiblePaths) {
            if (Test-Path $path) {
              $msbuildPath = $path
              break
            }
          }
          
          # Fallback to vswhere
          if (-not $msbuildPath) {
            $vsWhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
            if (Test-Path $vsWhere) {
              $msbuildPath = & $vsWhere -latest -requires Microsoft.Component.MSBuild -find "MSBuild\**\Bin\MSBuild.exe" | Select-Object -First 1
            }
          }
          
          if (-not $msbuildPath) {
            Write-Error "MSBuild not found!"
            exit 1
          }
          
          Write-Host "Found MSBuild: $msbuildPath"
          echo "msbuild_path=$msbuildPath" >> $env:GITHUB_OUTPUT

      - name: Build Driver (Release x64)
        run: |
          $msbuildPath = "${{ steps.msbuild.outputs.msbuild_path }}"
          
          Write-Host "Building with MSBuild: $msbuildPath"
          
          & $msbuildPath "SPOOFER V3.vcxproj" `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /m `
            /v:minimal `
            /p:WindowsDriver=true
          
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Build failed with exit code $LASTEXITCODE"
            exit $LASTEXITCODE
          }
          
          Write-Host "Build completed successfully!"

      - name: List Build Output
        if: always()
        run: |
          Write-Host "=== Build Output Directory ==="
          if (Test-Path "x64\Release") {
            Get-ChildItem "x64\Release" -Recurse | ForEach-Object { Write-Host $_.FullName }
          } elseif (Test-Path "x64") {
            Get-ChildItem "x64" -Recurse | ForEach-Object { Write-Host $_.FullName }
          } else {
            Write-Host "No x64 directory found"
            Get-ChildItem -Recurse -Filter "*.sys" | ForEach-Object { Write-Host $_.FullName }
          }

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: driver-build
          path: |
            x64/Release/*.sys
            x64/Release/*.inf
            x64/Release/*.cat
            x64/Release/*.pdb
            x64/Release/*.hex
          if-no-files-found: warn
