name: Build WDK Driver

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install WDK and Windows SDK
        run: |
          Write-Host "=== Installing WDK and Windows SDK ==="
          
          # Method 1: Use VS Installer to add WDK components
          $vsInstaller = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"
          $vsWhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          
          # Find VS installation path
          $vsPath = & $vsWhere -latest -property installationPath
          Write-Host "Visual Studio path: $vsPath"
          
          if (Test-Path $vsInstaller) {
            Write-Host "Installing WDK components via VS Installer..."
            
            # Install WDK workload and Windows SDK
            $process = Start-Process -FilePath $vsInstaller -ArgumentList `
              "modify", `
              "--installPath", "`"$vsPath`"", `
              "--add", "Microsoft.VisualStudio.Component.Windows11SDK.22621", `
              "--add", "Microsoft.VisualStudio.Component.Windows10SDK.19041", `
              "--quiet", "--norestart", "--wait" `
              -Wait -NoNewWindow -PassThru
            
            Write-Host "VS Installer exit code: $($process.ExitCode)"
          }
          
          # Method 2: Download and install WDK VSIX directly
          Write-Host "`n=== Installing WDK VSIX ==="
          
          $wdkVsixUrl = "https://go.microsoft.com/fwlink/?linkid=2284667"
          $wdkVsixPath = "$env:TEMP\wdk.vsix"
          
          try {
            # Download WDK VSIX
            $webClient = New-Object System.Net.WebClient
            $webClient.DownloadFile($wdkVsixUrl, $wdkVsixPath)
            
            if (Test-Path $wdkVsixPath) {
              $fileSize = (Get-Item $wdkVsixPath).Length
              Write-Host "Downloaded WDK VSIX: $fileSize bytes"
              
              # Install VSIX using VSIXInstaller
              $vsixInstaller = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\VSIXInstaller.exe"
              if (Test-Path $vsixInstaller) {
                Write-Host "Installing WDK VSIX..."
                Start-Process -FilePath $vsixInstaller -ArgumentList `
                  "/quiet", "/admin", $wdkVsixPath `
                  -Wait -NoNewWindow
                Write-Host "WDK VSIX installed"
              }
            }
          } catch {
            Write-Host "WDK VSIX installation failed: $_"
          }
          
          # Verify installation
          Write-Host "`n=== Verifying Installation ==="
          
          $kitsPath = "${env:ProgramFiles(x86)}\Windows Kits\10\Include"
          if (Test-Path $kitsPath) {
            Write-Host "Windows Kits include path exists: $kitsPath"
            Get-ChildItem $kitsPath | ForEach-Object { Write-Host "  SDK Version: $($_.Name)" }
          } else {
            Write-Host "WARNING: Windows Kits include path not found"
          }
          
          $kmPath = "${env:ProgramFiles(x86)}\Windows Kits\10\Include\10.0.26100.0\km"
          if (Test-Path $kmPath) {
            Write-Host "Kernel mode headers found: $kmPath"
            if (Test-Path "$kmPath\ntifs.h") {
              Write-Host "  ntifs.h: FOUND"
            } else {
              Write-Host "  ntifs.h: NOT FOUND"
            }
          } else {
            Write-Host "WARNING: Kernel mode headers not found"
          }

      - name: Find MSBuild
        id: msbuild
        run: |
          $possiblePaths = @(
            "${env:ProgramFiles(x86)}\Microsoft Visual Studio\2022\Enterprise\MSBuild\Current\Bin\MSBuild.exe",
            "${env:ProgramFiles}\Microsoft Visual Studio\2022\Enterprise\MSBuild\Current\Bin\MSBuild.exe",
            "${env:ProgramFiles(x86)}\Microsoft Visual Studio\2022\BuildTools\MSBuild\Current\Bin\MSBuild.exe",
            "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\MSBuild\Current\Bin\MSBuild.exe",
            "C:\Program Files (x86)\Microsoft Visual Studio\2022\Enterprise\MSBuild\Current\Bin\MSBuild.exe"
          )
          
          $msbuildPath = $null
          foreach ($path in $possiblePaths) {
            if (Test-Path $path) {
              $msbuildPath = $path
              break
            }
          }
          
          if (-not $msbuildPath) {
            $vsWhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
            if (Test-Path $vsWhere) {
              $msbuildPath = & $vsWhere -latest -requires Microsoft.Component.MSBuild -find "MSBuild\**\Bin\MSBuild.exe" | Select-Object -First 1
            }
          }
          
          if (-not $msbuildPath) {
            Write-Error "MSBuild not found!"
            exit 1
          }
          
          Write-Host "Found MSBuild: $msbuildPath"
          echo "msbuild_path=$msbuildPath" >> $env:GITHUB_OUTPUT

      - name: Build Driver (Release x64)
        run: |
          $msbuildPath = "${{ steps.msbuild.outputs.msbuild_path }}"
          
          Write-Host "Building with MSBuild: $msbuildPath"
          Write-Host "Current directory: $(Get-Location)"
          Write-Host "Project file exists: $(Test-Path 'SPOOFER V3.vcxproj')"
          
          & $msbuildPath "SPOOFER V3.vcxproj" `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /m `
            /v:detailed `
            /p:WindowsDriver=true `
            /p:DriverTargetPlatform=amd64
          
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Build failed with exit code $LASTEXITCODE"
            exit $LASTEXITCODE
          }
          
          Write-Host "Build completed successfully!"

      - name: List Build Output
        if: always()
        run: |
          Write-Host "=== Build Output Directory ==="
          if (Test-Path "build\Release") {
            Get-ChildItem "build\Release" -Recurse | ForEach-Object { Write-Host $_.FullName }
          } elseif (Test-Path "x64\Release") {
            Get-ChildItem "x64\Release" -Recurse | ForEach-Object { Write-Host $_.FullName }
          } else {
            Write-Host "Searching for .sys files..."
            Get-ChildItem -Recurse -Filter "*.sys" | ForEach-Object { Write-Host $_.FullName }
          }

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: driver-build
          path: |
            build/Release/*.sys
            build/Release/*.inf
            build/Release/*.cat
            build/Release/*.pdb
            build/Release/*.hex
            x64/Release/*.sys
            x64/Release/*.inf
            x64/Release/*.cat
            x64/Release/*.pdb
          if-no-files-found: warn
